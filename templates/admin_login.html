{% extends "base.html" %}
{% block conteudo %}
<section class="painel admin-login">
  <h1>Área de administração</h1>
  <p>Introduz a palavra-passe de administrador para consultar as encomendas.</p>
  <form method="post" class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Palavra-passe<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="botao largura-total" type="submit">Entrar</button>
  </form>
  <a href="{{ url_for('inicio') }}">Voltar à loja</a>
</section>
{% endblock %}
